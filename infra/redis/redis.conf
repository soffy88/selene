# CryptoWatch v4 — Redis configuration
requirepass changeme
maxmemory 2gb
# noeviction: under memory pressure, writes FAIL LOUDLY rather than silently evicting keys.
# This Redis holds critical trading state (cw4:risk:status, circuit_breaker:state) alongside
# cache; allkeys-lru could silently drop the risk state and disable the risk gate. Ephemeral
# cache keys (prices, etc.) MUST carry a TTL so they age out before the cap is reached.
maxmemory-policy noeviction
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
