# Prometheus scrape config (optimization item #12).
#
# To ACTIVATE: add a `prometheus` service to docker-compose.yml mounting this file,
# on the same network as the services below. The gateway now exposes a real
# /metrics endpoint; other FastAPI services can adopt shared/metrics.py the same way.
#
# Removed previously-orphaned targets that do not exist:
#   - data-service        (a no-op `tail -f /dev/null` placeholder; not a real service)
#   - redis-exporter      (not deployed — add the exporter service before scraping)
#   - postgres-exporter   (not deployed — add the exporter service before scraping)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # gateway exposes /metrics today (item #12).
  - job_name: 'gateway'
    static_configs: [{targets: ['gateway:5000']}]

  # The services below need a /metrics endpoint (adopt shared/metrics.py) before
  # their data will appear; the scrape config is ready for when they do.
  - job_name: 'signal-service'
    static_configs: [{targets: ['signal-service:8002']}]
  - job_name: 'portfolio-service'
    static_configs: [{targets: ['portfolio-service:8003']}]
  - job_name: 'risk-service'
    static_configs: [{targets: ['risk-service:8004']}]
  - job_name: 'execution-service'
    static_configs: [{targets: ['execution-service:8005']}]
  - job_name: 'notification-service'
    static_configs: [{targets: ['notification-service:8006']}]
  - job_name: 'monitoring-service'
    static_configs: [{targets: ['monitoring-service:8021']}]

  # Infra exporters — uncomment once the exporter services are added to compose:
  # - job_name: 'redis'
  #   static_configs: [{targets: ['redis-exporter:9121']}]
  # - job_name: 'timescaledb'
  #   static_configs: [{targets: ['postgres-exporter:9187']}]
