server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Security headers (item #21)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    # Container healthcheck endpoint (item #21 / #22)
    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { try_files $uri /index.html; }

    # Docker's embedded DNS. Using a VARIABLE in proxy_pass forces per-request
    # re-resolution (valid=10s) — a static proxy_pass resolves once at nginx
    # startup, so every gateway container recreate (new IP) used to break /api
    # and /ws until the frontend was manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway_upstream http://gateway:5000;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /ws {
        set $gateway_upstream_ws http://gateway:5000;
        proxy_pass $gateway_upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
