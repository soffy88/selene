server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Security headers (item #21)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    # Container healthcheck endpoint (item #21 / #22)
    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { try_files $uri /index.html; }
    location /api/ {
        proxy_pass http://gateway:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /ws {
        proxy_pass http://gateway:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
