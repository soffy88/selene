# CryptoWatch v4 — Docker Compose
# Wave 7.1b: 平台化 + 独立 Dockerfile per service
# 基础设施: platform-postgres(selene DB) / helios-redis(DB 3) / helios-net (外部)
# 启动: helios-secrets up selene

version: '3.9'

x-service-defaults: &defaults
  restart: unless-stopped
  networks: [helios-net]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

# -- 公共环境变量 (所有 python service 共用) ----------------------
x-common-env: &common_env
  TIMESCALE_URL:        ${TIMESCALE_URL}
  REDIS_URL:            ${REDIS_URL}
  LOG_LEVEL:            ${LOG_LEVEL:-INFO}
  ENVIRONMENT:          ${ENVIRONMENT:-production}
  DEBUG:                ${DEBUG:-false}
  EXEC_MODE:            ${EXEC_MODE:-NOTIFY_ONLY}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-OKX}

services:

  # ── Data ─────────────────────────────────────────────────────────────────
  data-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/data/Dockerfile
    command: python -m services.data.main
    environment:
      <<: *common_env
      SERVICE_NAME: data-service
      SERVICE_PORT: "8001"
      MARKET_DATA_API_KEY:       ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_API_SECRET:    ${MARKET_DATA_API_SECRET:-}
      MARKET_DATA_USE_PROXY:     ${MARKET_DATA_USE_PROXY:-false}
      HTTP_PROXY:                ${HTTP_PROXY:-}
      HTTPS_PROXY:               ${HTTPS_PROXY:-}
      OKX_PUBLIC_API_BASE:       ${OKX_PUBLIC_API_BASE:-https://www.okx.com}
      OKX_KLINES_PATH:           ${OKX_KLINES_PATH:-/api/v5/market/history-candles}
      OKX_FUNDING_HISTORY_PATH:  ${OKX_FUNDING_HISTORY_PATH:-/api/v5/public/funding-rate-history}
      OKX_MARK_PRICE_PATH:       ${OKX_MARK_PRICE_PATH:-/api/v5/public/mark-price}
      OKX_OPEN_INTEREST_PATH:    ${OKX_OPEN_INTEREST_PATH:-/api/v5/public/open-interest}
      OKX_LONG_SHORT_RATIO_PATH: ${OKX_LONG_SHORT_RATIO_PATH:-/api/v5/public/long-short-ratio}
      KCEX_API_BASE:             ${KCEX_API_BASE:-https://api.kcex.com}
      KCEX_FUTURES_BASE:         ${KCEX_FUTURES_BASE:-https://api.kcex.com}
      KCEX_KLINES_PATH:          ${KCEX_KLINES_PATH:-/fapi/v1/klines}
      KCEX_FUNDING_HISTORY_PATH: ${KCEX_FUNDING_HISTORY_PATH:-/fapi/v1/fundingRate}
      KCEX_OI_HISTORY_PATH:      ${KCEX_OI_HISTORY_PATH:-/futures/data/openInterestHist}
      KCEX_PREMIUM_INDEX_PATH:   ${KCEX_PREMIUM_INDEX_PATH:-/fapi/v1/premiumIndex}
      KCEX_LONG_SHORT_RATIO_PATH: ${KCEX_LONG_SHORT_RATIO_PATH:-/futures/data/globalLongShortAccountRatio}
    ports: ['8001:8001']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      start_period: 15s

  # ── Signal ───────────────────────────────────────────────────────────────
  signal-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/signal/Dockerfile
    command: python -m services.signal.main
    environment:
      <<: *common_env
      SERVICE_NAME: signal-service
      SERVICE_PORT: "8002"
      MIN_WIN_PROBABILITY:   ${MIN_WIN_PROBABILITY:-0.52}
      MIN_DATA_QUALITY:      ${MIN_DATA_QUALITY:-0.7}
      PUSH_THRESHOLD_STRONG: ${PUSH_THRESHOLD_STRONG:-0.62}
      PUSH_THRESHOLD_WATCH:  ${PUSH_THRESHOLD_WATCH:-0.56}
    depends_on:
      data-service: {condition: service_healthy}
    ports: ['8002:8002']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      start_period: 20s

  # ── Portfolio ─────────────────────────────────────────────────────────────
  portfolio-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/portfolio/Dockerfile
    command: python -m services.portfolio.main
    environment:
      <<: *common_env
      SERVICE_NAME: portfolio-service
      SERVICE_PORT: "8003"
      KELLY_FRACTION:         ${KELLY_FRACTION:-0.25}
      TARGET_VOLATILITY:      ${TARGET_VOLATILITY:-0.15}
      MAX_LEVERAGE:           ${MAX_LEVERAGE:-3.0}
      MAX_PORTFOLIO_DRAWDOWN: ${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      MAX_SINGLE_POSITION:    ${MAX_SINGLE_POSITION:-0.2}
    depends_on:
      signal-service: {condition: service_healthy}
    ports: ['8003:8003']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s

  # ── Risk ──────────────────────────────────────────────────────────────────
  risk-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/risk/Dockerfile
    command: python -m services.risk.main
    environment:
      <<: *common_env
      SERVICE_NAME: risk-service
      SERVICE_PORT: "8004"
      MAX_LEVERAGE:             ${MAX_LEVERAGE:-3.0}
      MAX_PORTFOLIO_DRAWDOWN:   ${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      MAX_SINGLE_POSITION:      ${MAX_SINGLE_POSITION:-0.2}
      FUNDING_ARB_ENABLED:      ${FUNDING_ARB_ENABLED:-false}
      FUNDING_MIN_RATE:         ${FUNDING_MIN_RATE:-0.0003}
      FUNDING_MAX_POSITION_USD: ${FUNDING_MAX_POSITION_USD:-10000}
    depends_on:
      portfolio-service: {condition: service_healthy}
    ports: ['8004:8004']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s

  # ── Execution ─────────────────────────────────────────────────────────────
  execution-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    command: python -m services.execution.main
    environment:
      <<: *common_env
      SERVICE_NAME:       execution-service
      SERVICE_PORT:       "8005"
      PRIMARY_EXCHANGE:   ${PRIMARY_EXCHANGE:-okx}
      OKX_API_KEY:        ${OKX_API_KEY}
      OKX_API_SECRET:     ${OKX_API_SECRET}
      OKX_PASSPHRASE:     ${OKX_PASSPHRASE}
      BINANCE_API_KEY:    ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    depends_on:
      risk-service: {condition: service_healthy}
    ports: ['8005:8005']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s

  # ── Notification ──────────────────────────────────────────────────────────
  notification-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    command: uvicorn services.notification.main:app --host 0.0.0.0 --port 8006
    environment:
      <<: *common_env
      SERVICE_NAME:         notification-service
      SERVICE_PORT:         "8006"
      TELEGRAM_BOT_TOKEN:   ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:     ${TELEGRAM_CHAT_ID:-}
      WX_WEBHOOK:           ${WX_WEBHOOK:-}
      FEISHU_WEBHOOK:       ${FEISHU_WEBHOOK:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
    ports: ['8006:8006']
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}

  # ── Onchain Sentinel ──────────────────────────────────────────────────────
  onchain-sentinel:
    <<: *defaults
    build:
      context: .
      dockerfile: services/onchain/Dockerfile
    command: python -m services.onchain.main
    environment:
      <<: *common_env
      SERVICE_NAME:          onchain-sentinel
      SERVICE_PORT:          "8020"
      INFURA_KEY:            ${INFURA_KEY:-}
      HELIUS_KEY:            ${HELIUS_KEY:-}
      WX_WEBHOOK:            ${WX_WEBHOOK:-}
      FEISHU_WEBHOOK:        ${FEISHU_WEBHOOK:-}
      PUSH_THRESHOLD_STRONG: ${PUSH_THRESHOLD_STRONG:-0.62}
      PUSH_THRESHOLD_WATCH:  ${PUSH_THRESHOLD_WATCH:-0.56}
    depends_on:
      signal-service:       {condition: service_healthy}
      notification-service: {condition: service_started}
    ports: ['8020:8020']
    volumes:
      - onchain_history:/root/.chain_sentinel
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Onchain Workers ───────────────────────────────────────────────────────
  onchain-btc-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: services/onchain/btc/Dockerfile
    command: python -m services.onchain.btc.worker
    environment:
      <<: *common_env
      SERVICE_NAME:    onchain-btc-worker
      THRESHOLD_BTC:   ${THRESHOLD_BTC:-100}
      THRESHOLD_MINER: ${THRESHOLD_MINER:-500}
    depends_on:
      onchain-sentinel: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.3', memory: 128M}

# H3-PENDING   onchain-eth-worker:
# H3-PENDING     <<: *defaults
# H3-PENDING     build:
# H3-PENDING       context: .
# H3-PENDING       dockerfile: services/onchain/eth/Dockerfile
# H3-PENDING     command: python -m services.onchain.eth.worker
# H3-PENDING     environment:
# H3-PENDING       <<: *common_env
# H3-PENDING       SERVICE_NAME:  onchain-eth-worker
# H3-PENDING       INFURA_KEY:    ${INFURA_KEY:-}
# H3-PENDING       THRESHOLD_ETH: ${THRESHOLD_ETH:-500}
# H3-PENDING     depends_on:
# H3-PENDING       onchain-sentinel: {condition: service_healthy}
# H3-PENDING     deploy:
# H3-PENDING       resources:
# H3-PENDING         limits: {cpus: '0.3', memory: 128M}
# H3-PENDING 
# H3-PENDING   onchain-sol-worker:
# H3-PENDING     <<: *defaults
# H3-PENDING     build:
# H3-PENDING       context: .
# H3-PENDING       dockerfile: services/onchain/sol/Dockerfile
# H3-PENDING     command: python -m services.onchain.sol.worker
# H3-PENDING     environment:
# H3-PENDING       <<: *common_env
# H3-PENDING       SERVICE_NAME:  onchain-sol-worker
# H3-PENDING       HELIUS_KEY:    ${HELIUS_KEY:-}
# H3-PENDING       THRESHOLD_SOL: ${THRESHOLD_SOL:-50000}
# H3-PENDING     depends_on:
# H3-PENDING       onchain-sentinel: {condition: service_healthy}
# H3-PENDING     deploy:
# H3-PENDING       resources:
# H3-PENDING         limits: {cpus: '0.3', memory: 128M}

  # ── sel Bar-Close Scheduler ──────────────────────────────────────────────
  sel-bar-runner:
    <<: *defaults
    build:
      context: .
      dockerfile: services/sel_bar_runner/Dockerfile
    command: python -m services.sel_bar_runner.main
    environment:
      <<: *common_env
      SERVICE_NAME: sel-bar-runner
      SEL_SYMBOL:   ${SEL_SYMBOL:-BTCUSDT}
      SEL_INST_ID:  ${SEL_INST_ID:-BTC-USDT-SWAP}
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from sel_engine.scheduler.health import check; exit(0 if check() else 1)'"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 75m  # first trigger ~1h after start; 15m tolerance

  # ── sel Collectors ───────────────────────────────────────────────────────
  sel-orderbook:
    <<: *defaults
    build:
      context: .
      dockerfile: services/sel_collectors/Dockerfile
    command: python -m services.sel_collectors.run_orderbook
    environment:
      <<: *common_env
      SERVICE_NAME: sel-orderbook
      SEL_SYMBOL:   ${SEL_SYMBOL:-BTCUSDT}
      SEL_INST_ID:  ${SEL_INST_ID:-BTC-USDT-SWAP}
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 60s
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}

  sel-trade-flow:
    <<: *defaults
    build:
      context: .
      dockerfile: services/sel_collectors/Dockerfile
    command: python -m services.sel_collectors.run_trade_flow
    environment:
      <<: *common_env
      SERVICE_NAME: sel-trade-flow
      SEL_SYMBOL:   ${SEL_SYMBOL:-BTCUSDT}
      SEL_INST_ID:  ${SEL_INST_ID:-BTC-USDT-SWAP}
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 60s
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}

  sel-oi:
    <<: *defaults
    build:
      context: .
      dockerfile: services/sel_collectors/Dockerfile
    command: python -m services.sel_collectors.run_oi
    environment:
      <<: *common_env
      SERVICE_NAME: sel-oi
      SEL_SYMBOL:   ${SEL_SYMBOL:-BTCUSDT}
      SEL_INST_ID:  ${SEL_INST_ID:-BTC-USDT-SWAP}
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 60s
    deploy:
      resources:
        limits: {cpus: '0.1', memory: 64M}

  # ── Monitoring ────────────────────────────────────────────────────────────
  monitoring-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    command: python -m services.monitoring.main
    environment:
      <<: *common_env
      SERVICE_NAME:              monitoring-service
      SERVICE_PORT:              "8021"
      REPORT_HOUR_CST:           ${REPORT_HOUR_CST:-9}
      REPORT_DAYS:               ${REPORT_DAYS:-1}
      REPORT_PUSH:               ${REPORT_PUSH:-true}
      CONSECUTIVE_DAYS_REQUIRED: ${CONSECUTIVE_DAYS_REQUIRED:-3}
      TELEGRAM_BOT_TOKEN:        ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:          ${TELEGRAM_CHAT_ID:-}
      WX_WEBHOOK:                ${WX_WEBHOOK:-}
    depends_on:
      signal-service: {condition: service_healthy}
      risk-service:   {condition: service_healthy}
    ports: ['8021:8021']
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Gateway ───────────────────────────────────────────────────────────────
  gateway:
    <<: *defaults
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 5000
    environment:
      <<: *common_env
      SERVICE_NAME: gateway
      SERVICE_PORT: "5000"
    depends_on:
      data-service:      {condition: service_healthy}
      signal-service:    {condition: service_healthy}
      portfolio-service: {condition: service_healthy}
      risk-service:      {condition: service_healthy}
      execution-service: {condition: service_healthy}
    ports: ['5000:5000']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    <<: *defaults
    build:
      context: ./frontend
    ports: ['8088:80']
    depends_on:
      gateway: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.1', memory: 64M}

  # ── Healthcheck ───────────────────────────────────────────────────────────
  healthcheck-service:
    build:
      context: .
      dockerfile: services/healthcheck/Dockerfile
    container_name: selene-healthcheck-1
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL}
      TIMESCALE_URL: ${TIMESCALE_URL}
      HELIOS_REDIS_URL: redis://helios-redis:6379/0
      RULES_PATH: /app/configs/healthcheck-rules.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [helios-net]
    deploy:
      resources:
        limits: {cpus: '0.1', memory: 128M}

  # ── sel_v2 real-time data collectors ──────────────────────────────
  v2-tick-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_tick_collector
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://172.23.224.1:30810}
      - HTTP_PROXY=${HTTP_PROXY:-http://172.23.224.1:30810}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  v2-lob-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_lob_collector
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://172.23.224.1:30810}
      - HTTP_PROXY=${HTTP_PROXY:-http://172.23.224.1:30810}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
    networks:
      - helios-net
    restart: unless-stopped

  v2-liquidation-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_liquidation_collector
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://172.23.224.1:30810}
      - HTTP_PROXY=${HTTP_PROXY:-http://172.23.224.1:30810}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
    networks:
      - helios-net
    restart: unless-stopped

  v2-derivatives-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_derivatives_collector
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://172.23.224.1:30810}
      - HTTP_PROXY=${HTTP_PROXY:-http://172.23.224.1:30810}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
    networks:
      - helios-net
    restart: unless-stopped

  v2-onchain-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_onchain_collector
    env_file: .env
    environment:
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
    networks:
      - helios-net
    restart: unless-stopped

  v2-bar-aggregator:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_bar_aggregator
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://172.23.224.1:30810}
      - HTTP_PROXY=${HTTP_PROXY:-http://172.23.224.1:30810}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

networks:
  helios-net:
    external: true

volumes:
  onchain_history:    # SQLite 历史胜率数据持久化
