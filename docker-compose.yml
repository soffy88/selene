# CryptoWatch v4 — Docker Compose
# Wave 7.1a: 平台化改造 — 共享 platform-postgres / helios-redis / helios-net
# 移除: timescaledb / redis / grafana / prometheus (改用 platform 共享服务)

version: '3.9'

x-service-defaults: &defaults
  restart: unless-stopped
  networks: [helios-net]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

x-python-defaults: &python
  <<: *defaults
  build:
    context: .
    dockerfile: infra/Dockerfile.service
  env_file: .env

services:

  # ── Application Services ────────────────────────────────────────────────────
  data-service:
    <<: *python
    command: python -m services.data.main
    environment:
      SERVICE_NAME: data-service
      SERVICE_PORT: "8001"
    ports: ['8001:8001']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      start_period: 15s

  signal-service:
    <<: *python
    command: python -m services.signal.main
    environment:
      SERVICE_NAME: signal-service
      SERVICE_PORT: "8002"
    depends_on:
      data-service: {condition: service_healthy}
    ports: ['8002:8002']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      start_period: 20s

  portfolio-service:
    <<: *python
    command: python -m services.portfolio.main
    environment:
      SERVICE_NAME: portfolio-service
      SERVICE_PORT: "8003"
    depends_on:
      signal-service: {condition: service_healthy}
    ports: ['8003:8003']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s

  risk-service:
    <<: *python
    command: python -m services.risk.main
    environment:
      SERVICE_NAME: risk-service
      SERVICE_PORT: "8004"
    depends_on:
      portfolio-service: {condition: service_healthy}
    ports: ['8004:8004']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s

  execution-service:
    <<: *python
    command: python -m services.execution.main
    environment:
      SERVICE_NAME: execution-service
      SERVICE_PORT: "8005"
    depends_on:
      risk-service: {condition: service_healthy}
    ports: ['8005:8005']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s

  notification-service:
    <<: *python
    command: python -m services.notification.main
    environment:
      SERVICE_NAME: notification-service
      SERVICE_PORT: "8006"
    ports: ['8006:8006']
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}

  # ── Onchain Sentinel (v4.1) ─────────────────────────────────────────────────
  onchain-sentinel:
    <<: *python
    command: python -m services.onchain.main
    environment:
      SERVICE_NAME: onchain-sentinel
      SERVICE_PORT: "8020"
      WX_WEBHOOK:      ${WX_WEBHOOK:-}
      FEISHU_WEBHOOK:  ${FEISHU_WEBHOOK:-}
      INFURA_KEY:      ${INFURA_KEY:-}
      HELIUS_KEY:      ${HELIUS_KEY:-}
      PUSH_THRESHOLD_STRONG: ${PUSH_THRESHOLD_STRONG:-0.62}
      PUSH_THRESHOLD_WATCH:  ${PUSH_THRESHOLD_WATCH:-0.56}
    ports: ['8020:8020']
    depends_on:
      signal-service:       {condition: service_healthy}
      notification-service: {condition: service_started}
    volumes:
      - onchain_history:/root/.chain_sentinel
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  onchain-btc-worker:
    <<: *python
    command: python -m services.onchain.btc.worker
    environment:
      SERVICE_NAME:  onchain-btc-worker
      THRESHOLD_BTC: ${THRESHOLD_BTC:-100}
      THRESHOLD_MINER: ${THRESHOLD_MINER:-500}
    depends_on:
      onchain-sentinel: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.3', memory: 128M}

  onchain-eth-worker:
    <<: *python
    command: python -m services.onchain.eth.worker
    environment:
      SERVICE_NAME:  onchain-eth-worker
      INFURA_KEY:    ${INFURA_KEY:-}
      THRESHOLD_ETH: ${THRESHOLD_ETH:-500}
    depends_on:
      onchain-sentinel: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.3', memory: 128M}

  onchain-sol-worker:
    <<: *python
    command: python -m services.onchain.sol.worker
    environment:
      SERVICE_NAME:  onchain-sol-worker
      HELIUS_KEY:    ${HELIUS_KEY:-}
      THRESHOLD_SOL: ${THRESHOLD_SOL:-50000}
    depends_on:
      onchain-sentinel: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.3', memory: 128M}

  # ── Monitoring Service ──────────────────────────────────────────────────────
  monitoring-service:
    <<: *python
    command: python -m services.monitoring.main
    environment:
      SERVICE_NAME: monitoring-service
      SERVICE_PORT: "8021"
      REPORT_HOUR_CST:           ${REPORT_HOUR_CST:-9}
      REPORT_DAYS:               ${REPORT_DAYS:-1}
      REPORT_PUSH:               ${REPORT_PUSH:-true}
      CONSECUTIVE_DAYS_REQUIRED: ${CONSECUTIVE_DAYS_REQUIRED:-3}
    ports: ['8021:8021']
    depends_on:
      signal-service: {condition: service_healthy}
      risk-service:   {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    <<: *python
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 5000
    environment:
      SERVICE_NAME: gateway
      SERVICE_PORT: "5000"
    depends_on:
      data-service:      {condition: service_healthy}
      signal-service:    {condition: service_healthy}
      portfolio-service: {condition: service_healthy}
      risk-service:      {condition: service_healthy}
      execution-service: {condition: service_healthy}
    ports: ['5000:5000']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    <<: *defaults
    build:
      context: ./frontend
    ports: ['8088:80']
    depends_on:
      gateway: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: '0.1', memory: 64M}

networks:
  helios-net:
    external: true

volumes:
  onchain_history:    # SQLite 历史胜率数据持久化
