# CryptoWatch v4 — Docker Compose
# Wave 7.1b: 平台化 + 独立 Dockerfile per service
# 基础设施: platform-postgres(selene DB) / helios-redis(DB 3) / helios-net (外部)
# 启动: helios-secrets up selene

x-service-defaults: &defaults
  restart: unless-stopped
  networks: [helios-net]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

# -- 公共环境变量 (所有 python service 共用) ----------------------
x-common-env: &common_env
  TIMESCALE_URL:        ${TIMESCALE_URL}
  REDIS_URL:            ${REDIS_URL}
  LOG_LEVEL:            ${LOG_LEVEL:-INFO}
  # Default to development: execution adapters use testnet unless ENVIRONMENT
  # =production, and the live-exec boot guard only arms in production. A safe
  # default means an accidental deploy without an explicit env lands on testnet,
  # not mainnet. Set ENVIRONMENT=production deliberately for a real deploy.
  ENVIRONMENT:          ${ENVIRONMENT:-development}
  DEBUG:                ${DEBUG:-false}
  # PAPER(纯模拟撮合):用户拍板 2026-07-10("一定要让能开单")。零真实下单——PAPER 分支
  # 不触任何 exchange adapter(submit_to_exchange 模拟路径,按 cw4:prices 定价成交),
  # 写 orders 表 + order.lifecycle,风控门全程参与。🔒 Never 已同步修订:禁的是 live 模式
  # (AUTO_EXEC/CONFIRM_THEN_EXEC)。写死不再 ${} 插值:.env:34 的 EXEC_MODE=NOTIFY_ONLY
  # 已过时(受保护文件,待人工清理)。
  EXEC_MODE:            PAPER
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-OKX}

services:

  # ── Data ─────────────────────────────────────────────────────────────────
  # NOTE (item #22): the data-service placeholder was removed. services/data was
  # never implemented; real ingestion is the v2-*-collector services. Its
  # permanently-unhealthy no-op container and the depends_on edges that pointed at
  # it have been dropped.

  # ── Market scanner ─────────────────────────────────────────────────────────
  # v4 链缺失的前半截(2026-07-10):小币趋势发现 + market.candles/market.raw 生产者。
  # 此前两个输入流零生产者,signal.scored 恒为 0(整条 v4 链无头)。
  # Binance USD-M REST,经 helios-proxy(与 execution adapter 同一 venue)。
  market-scanner:
    <<: *defaults
    build:
      context: .
      dockerfile: services/scanner/Dockerfile
    command: python -m services.scanner.main
    environment:
      <<: *common_env
      SERVICE_NAME: market-scanner
      # 显式写死可用代理:.env 里的 HTTPS_PROXY 指向已失效的旧 IP(STATUS Needs-Human,
      # .env 受保护待人工改),compose ${} 插值会读到它,不能用作默认值来源。
      SCANNER_PROXY: http://helios-proxy:2080
      MIN_QUOTE_VOLUME_USD: ${MIN_QUOTE_VOLUME_USD:-20000000}
      MIN_24H_CHANGE_PCT:   ${MIN_24H_CHANGE_PCT:-5.0}
      SCANNER_TOP_N:        ${SCANNER_TOP_N:-5}
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}

  # ── Signal ───────────────────────────────────────────────────────────────
  signal-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/signal/Dockerfile
    command: python -m services.signal.main
    environment:
      <<: *common_env
      SERVICE_NAME: signal-service
      SERVICE_PORT: "8002"
      DISABLE_V4_ENTRIES: "true"
      MIN_WIN_PROBABILITY:   ${MIN_WIN_PROBABILITY:-0.52}
      MIN_DATA_QUALITY:      ${MIN_DATA_QUALITY:-0.7}
      PUSH_THRESHOLD_STRONG: ${PUSH_THRESHOLD_STRONG:-0.62}
      PUSH_THRESHOLD_WATCH:  ${PUSH_THRESHOLD_WATCH:-0.56}
    ports: ['8002:8002']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      start_period: 20s

  # ── Portfolio ─────────────────────────────────────────────────────────────
  portfolio-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/portfolio/Dockerfile
    command: python -m services.portfolio.main
    environment:
      <<: *common_env
      SERVICE_NAME: portfolio-service
      SERVICE_PORT: "8003"
      KELLY_FRACTION:         ${KELLY_FRACTION:-0.25}
      TARGET_VOLATILITY:      ${TARGET_VOLATILITY:-0.15}
      MAX_LEVERAGE:           ${MAX_LEVERAGE:-3.0}
      MAX_PORTFOLIO_DRAWDOWN: ${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      MAX_SINGLE_POSITION:    ${MAX_SINGLE_POSITION:-0.2}
    depends_on:
      - signal-service
    ports: ['8003:8003']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s

  # ── Risk ──────────────────────────────────────────────────────────────────
  risk-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/risk/Dockerfile
    command: python -m services.risk.main
    environment:
      <<: *common_env
      SERVICE_NAME: risk-service
      SERVICE_PORT: "8004"
      MAX_LEVERAGE:             ${MAX_LEVERAGE:-3.0}
      MAX_PORTFOLIO_DRAWDOWN:   ${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      MAX_SINGLE_POSITION:      ${MAX_SINGLE_POSITION:-0.2}
      FUNDING_ARB_ENABLED:      ${FUNDING_ARB_ENABLED:-false}
      FUNDING_MIN_RATE:         ${FUNDING_MIN_RATE:-0.0003}
      FUNDING_MAX_POSITION_USD: ${FUNDING_MAX_POSITION_USD:-10000}
    depends_on:
      - portfolio-service
    ports: ['8004:8004']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s

  # ── Execution ─────────────────────────────────────────────────────────────
  execution-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    command: python -m services.execution.main
    environment:
      <<: *common_env
      SERVICE_NAME:       execution-service
      SERVICE_PORT:       "8005"
      PRIMARY_EXCHANGE:   ${PRIMARY_EXCHANGE:-okx}
      OKX_API_KEY:        ${OKX_API_KEY}
      OKX_API_SECRET:     ${OKX_API_SECRET}
      OKX_PASSPHRASE:     ${OKX_PASSPHRASE}
      BINANCE_API_KEY:    ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    depends_on:
      - risk-service
    ports: ['8005:8005']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s

  # ── Notification ──────────────────────────────────────────────────────────
  notification-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    command: uvicorn services.notification.main:app --host 0.0.0.0 --port 8006
    environment:
      <<: *common_env
      SERVICE_NAME:         notification-service
      SERVICE_PORT:         "8006"
      TELEGRAM_BOT_TOKEN:   ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:     ${TELEGRAM_CHAT_ID:-}
      WX_WEBHOOK:           ${WX_WEBHOOK:-}
      FEISHU_WEBHOOK:       ${FEISHU_WEBHOOK:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
    ports: ['8006:8006']
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}

  # ── Onchain Sentinel ──────────────────────────────────────────────────────
  onchain-sentinel:
    <<: *defaults
    build:
      context: .
      dockerfile: services/onchain/Dockerfile
    command: python -m services.onchain.main
    environment:
      <<: *common_env
      SERVICE_NAME:          onchain-sentinel
      SERVICE_PORT:          "8020"
      INFURA_KEY:            ${INFURA_KEY:-}
      HELIUS_KEY:            ${HELIUS_KEY:-}
      WX_WEBHOOK:            ${WX_WEBHOOK:-}
      FEISHU_WEBHOOK:        ${FEISHU_WEBHOOK:-}
      PUSH_THRESHOLD_STRONG: ${PUSH_THRESHOLD_STRONG:-0.62}
      PUSH_THRESHOLD_WATCH:  ${PUSH_THRESHOLD_WATCH:-0.56}
    depends_on:
      - signal-service
      - notification-service
    ports: ['8020:8020']
    volumes:
      - onchain_history:/root/.chain_sentinel
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Onchain Workers ───────────────────────────────────────────────────────
  onchain-btc-worker:
    <<: *defaults
    build:
      context: .
      dockerfile: services/onchain/btc/Dockerfile
    command: python -m services.onchain.btc.worker
    environment:
      <<: *common_env
      SERVICE_NAME:    onchain-btc-worker
      THRESHOLD_BTC:   ${THRESHOLD_BTC:-100}
      THRESHOLD_MINER: ${THRESHOLD_MINER:-500}
    depends_on:
      - onchain-sentinel
    deploy:
      resources:
        limits: {cpus: '0.3', memory: 128M}

  # ── Monitoring ────────────────────────────────────────────────────────────
  monitoring-service:
    <<: *defaults
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    command: python -m services.monitoring.main
    environment:
      <<: *common_env
      SERVICE_NAME:              monitoring-service
      SERVICE_PORT:              "8021"
      REPORT_HOUR_CST:           ${REPORT_HOUR_CST:-9}
      REPORT_DAYS:               ${REPORT_DAYS:-1}
      REPORT_PUSH:               ${REPORT_PUSH:-true}
      CONSECUTIVE_DAYS_REQUIRED: ${CONSECUTIVE_DAYS_REQUIRED:-3}
      TELEGRAM_BOT_TOKEN:        ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:          ${TELEGRAM_CHAT_ID:-}
      WX_WEBHOOK:                ${WX_WEBHOOK:-}
    depends_on:
      - signal-service
      - risk-service
    ports: ['8021:8021']
    deploy:
      resources:
        limits: {cpus: '0.2', memory: 128M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Gateway ───────────────────────────────────────────────────────────────
  gateway:
    <<: *defaults
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 5000
    environment:
      <<: *common_env
      SERVICE_NAME: gateway
      SERVICE_PORT: "5000"
      # 公网域名 sel.kanpan.co 走 Caddy→nginx 同源反代，浏览器不直连 gateway，
      # 故 CORS 非必需；这里显式放行以防将来有直连 XHR。dev 保留 localhost。
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost,http://localhost:80,https://sel.kanpan.co}
      # The mounted sel_v2 paper API (/api/v2/sel/*) reads DB_URL to reach the platform DB;
      # without it every sel_v2 endpoint 500s ("DB_URL must be set"). Same target the v2
      # collectors / paper engine use.
      DB_URL: postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
    depends_on:
      - signal-service
      - portfolio-service
      - risk-service
      - execution-service
    ports: ['5000:5000']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    <<: *defaults
    build:
      context: ./frontend
    ports: ['8088:80']
    depends_on:
      - gateway
    # Healthcheck via the nginx /healthz location added in item #21.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: '0.1', memory: 64M}

  # ── Healthcheck ───────────────────────────────────────────────────────────
  selene-healthcheck:
    build: ./services/healthcheck
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://helios-proxy:2080}
      - HTTP_PROXY=${HTTP_PROXY:-http://helios-proxy:2080}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway,api.telegram.org
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - helios-net
    restart: unless-stopped

  # ── sel_v2 real-time data collectors ──────────────────────────────
  v2-tick-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # 采集层合并 P4:逐笔成交改读中立 iris/md(marketdata.md.trades,venue=okx——实测
    # Binance WS 经 helios-proxy 不通,只有 OKX 经 10808 隧道可行)。不再自连 OKX WS。
    # 回滚:command 切回 `python -m sel_v2.data.v2_tick_collector`(旧文件保留)。
    command: python -m sel_v2.data.v2_ticks_md_adapter --loop 5
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - MD_DSN=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/marketdata
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  v2-lob-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # 采集层合并 P3:Binance LOB 微观特征改读中立 iris/md(marketdata.md.orderbook_features),
    # 不再自打 /fapi/v1/depth。回滚:command 切回 `python -m sel_v2.data.v2_lob_collector`
    # (旧文件保留)。DB→DB,无 egress/代理。
    command: python -m sel_v2.data.v2_lob_md_adapter --loop 20
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - MD_DSN=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/marketdata
    networks:
      - helios-net
    restart: unless-stopped

  v2-liquidation-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # 采集层合并 P5:清算事件改读中立 iris/md(marketdata.md.liquidations,venue=okx,
    # 与 P4 trades 共用 iris 侧同一条 WS 连接)。不再自连 OKX WS。回滚:command 切回
    # `python -m sel_v2.data.v2_liquidation_collector`(旧文件保留)。
    command: python -m sel_v2.data.v2_liquidations_md_adapter --loop 15
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - MD_DSN=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/marketdata
    networks:
      - helios-net
    restart: unless-stopped

  v2-derivatives-collector:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # 采集层合并(方案 B):funding/OI 改由统一生产者 iris 采集,本服务转为 adapter 读 md:* 回填原表。
    # 回滚:command 切回 `python -m sel_v2.data.v2_derivatives_collector` 即恢复自采(旧文件保留)。
    command: python -m sel_v2.data.v2_derivatives_adapter
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://helios-proxy:2080}
      - HTTP_PROXY=${HTTP_PROXY:-http://helios-proxy:2080}
      - BINANCE_PROXY=${BINANCE_PROXY:-http://helios-proxy:2080}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - MD_REDIS_URL=redis://helios-redis:6379/1
    networks:
      - helios-net
    restart: unless-stopped

  # Binance spot ticker poller (Wave S2C Part 3). Second reachable price for the S2 Step-5
  # cross-exchange divergence check (perp-vs-spot basis; OKX is blocked). REST poll every 30s
  # via the known-good BINANCE_PROXY (helios-proxy:2080), NOT the container HTTPS_PROXY.
  v2-binance-ticker:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_binance_ticker
    env_file: .env
    environment:
      - BINANCE_PROXY=${BINANCE_PROXY:-http://helios-proxy:2080}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  # Forward 4H-bar poller (2026-07-03 OKX→Binance migration). The tick-fed bar-aggregator
  # is dead while OKX WS is unreachable, so this keeps v2_bars_4h fresh from Binance REST.
  # Idempotent (ON CONFLICT DO NOTHING); coexists with v2-bar-aggregator harmlessly.
  v2-bar-poller:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # 采集层合并 P2b:Binance 4H bar 改读中立 iris/md(marketdata.md.ohlcv),不再自打 fapi/klines。
    # 回滚:command 切回 `python -m sel_v2.data.binance_backfill --loop 600 --years 0.05`
    # (旧文件保留;深史一次性回填也用它)。DB→DB, 无 egress/代理。
    command: python -m sel_v2.data.v2_bars_md_adapter --loop 600
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - MD_DSN=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/marketdata
    networks:
      - helios-net
    restart: unless-stopped

  # Weekly live capture-rate monitor (Wave V22-D, offline follow-up to V22-C). Pure
  # read+append diagnostic — no strategy/state coupling, no live trading impact.
  # Monthly observation-tool evaluation (optimization A3). Sleeps until the 1st
  # of each month 01:00 UTC, runs ToolEvaluator over all 12 tools (90d lookback),
  # writes v2_tool_evaluation_results + a v2_decision_trail summary row.
  v2-tool-eval-monthly:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.evaluation.monthly_eval --serve
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - POSTGRES_HOST=platform-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=selene_app
      - POSTGRES_PASSWORD=${SELENE_APP_PASSWORD}
      - POSTGRES_DB=selene
    networks:
      - helios-net
    restart: unless-stopped

  # ICT-1 VPIN live monitor (v2.2 lens batch, observation-only). Polls v2_ticks
  # every 5 min, upserts high-VPIN events into v2_inverse_vocab_events
  # (vocab='vpin'). Stateless restart recovery (trailing-30d tick replay).
  v2-vpin-monitor:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.observation_tools.vpin_monitor --serve
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  # Sleeps until the next Monday 00:30 UTC, runs sel_v2/offline/capture_monitor.py,
  # writes v2_capture_rate_weekly + appends sel_v2/reports/capture_rate_weekly.md.
  v2-capture-monitor:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    # Two weekly jobs share this container, an hour apart so they never contend
    # for the DB: capture_monitor at Mon 00:30 UTC, fill_prob (Wave EXEC-S) at
    # Mon 01:30. `wait -n` returns as soon as EITHER exits, and we then exit
    # non-zero so restart:unless-stopped recreates the container — without it a
    # dead scheduler would sit silently inside a "running" container.
    command: >
      bash -c "python -m sel_v2.offline.capture_monitor --serve &
               python -m sel_v2.offline.fill_prob --serve &
               wait -n; exit 1"
    env_file: .env
    environment:
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  # v2-onchain-collector REMOVED (item #24): on-chain exchange-flow ingestion is
  # formally out-of-scope. The collector was a no-op stub (no paid data source) and
  # v2_onchain_exchange_flows has zero state-machine impact per DATA_FOUNDATION_ROADMAP
  # §6. Re-add this service only after funding a real source (Glassnode/Nansen/
  # CryptoQuant) and implementing sel_v2/data/v2_onchain_collector.

  v2-bar-aggregator:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.data.v2_bar_aggregator
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://helios-proxy:2080}
      - HTTP_PROXY=${HTTP_PROXY:-http://helios-proxy:2080}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - SYMBOLS=BTC-USDT
    networks:
      - helios-net
    restart: unless-stopped

  # v2-ofi-persister REMOVED (GL1 T0.3/D1, 2026-07-08): v2_ofi_features was a
  # write-only duplicate — the paper engine already recomputes the same per-bar
  # OFI/LOB values inline (_load_microstructure_series). D1 kept the inline compute
  # (no engine data-path change) and instead audits what it actually used into
  # v2_strategy_decision.decision_trail (StrategyEngine._bar_snapshot). Rollback:
  # restore this block (command: python -m sel_v2.data.ofi_persister, same env as
  # v2-bar-aggregator below); sel_v2/data/ofi_persister.py and the v2_ofi_features
  # table are both kept (DEPRECATED, not dropped).

  v2-paper-engine:
    build:
      context: .
      dockerfile: sel_v2/Dockerfile
    command: python -m sel_v2.paper.paper_engine
    env_file: .env
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-http://helios-proxy:2080}
      - HTTP_PROXY=${HTTP_PROXY:-http://helios-proxy:2080}
      - NO_PROXY=localhost,127.0.0.1,platform-postgres,helios-redis,gateway
      - DB_URL=postgresql://selene_app:${SELENE_APP_PASSWORD}@platform-postgres:5432/selene
      - REDIS_URL=redis://helios-redis:6379/3
      # Strategy params_loader uses POSTGRES_* (not DB_URL); point them at the platform DB
      # so the paper engine can load H2/strategy params instead of failing to localhost.
      - POSTGRES_HOST=platform-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=selene_app
      - POSTGRES_PASSWORD=${SELENE_APP_PASSWORD}
      - POSTGRES_DB=selene
      - SYMBOLS=BTC-USDT
    volumes:
      - ./sel_v2:/app/sel_v2:ro
    networks:
      - helios-net
    depends_on:
      - v2-tick-collector
      - v2-bar-aggregator
    restart: unless-stopped

networks:
  helios-net:
    external: true

volumes:
  onchain_history:    # SQLite 历史胜率数据持久化
