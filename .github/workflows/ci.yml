name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # requirements-ci.txt pins numpy==2.5.0 which requires Python >= 3.12
          # (3.11 made the dependency install itself fail — CI was dead on arrival)
          python-version: "3.12"

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Install the quant stack (required)
        # oprim/oskill are NOT private and need no index secret: both are public
        # MIT repos under helios-plat. Pinned to the versions production actually
        # vendors (vendor/oprim-3.10.33, vendor/oskill-4.3.0) so CI verifies the
        # code that is really running, not an untested newer tag.
        #
        # Installed by explicit `name @ git+URL`, never a bare `pip install
        # oskill`: PyPI has an UNRELATED package squatting that name ("pytest for
        # Agent Skills"), and oprim is not on PyPI at all.
        #
        # --no-deps mirrors the production image (sel_v2/Dockerfile), which runs
        # these lazily-loaded packages against a small dependency set. Their eager
        # imports are covered by requirements-ci.txt; resolving oprim's full
        # declared surface would pull stripe/alipay-sdk/paramiko/mcp into CI for
        # no reason.
        run: |
          pip install --no-deps \
            "oprim @ git+https://github.com/helios-plat/oprim@v3.10.33" \
            "oskill @ git+https://github.com/helios-plat/oskill@v4.3.0"

      - name: Lint (ruff, non-blocking)
        run: ruff check . || true

      - name: Run tests
        # -rs prints every skip with its reason, so private-stack gaps stay
        # visible in the log instead of hiding inside a "N skipped" count.
        run: pytest -q -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor the quant stack into the build context
        # sel_v2/Dockerfile COPYs vendor/oprim + vendor/oskill as unpacked package
        # dirs, and vendor/ is gitignored, so the build context must be populated
        # first — this is why the job failed with `"/vendor/oprim": not found` on
        # every run. --no-deps mirrors the local vendor/ layout exactly (just the
        # two packages; the Dockerfile installs their runtime deps itself).
        run: |
          pip install --target vendor --no-deps \
            "oprim @ git+https://github.com/helios-plat/oprim@v3.10.33" \
            "oskill @ git+https://github.com/helios-plat/oskill@v4.3.0"

      - name: Build sel_v2 image
        # Smoke-build the primary image to catch Dockerfile/context regressions.
        run: docker build -f sel_v2/Dockerfile -t selene-sel-v2:ci .
