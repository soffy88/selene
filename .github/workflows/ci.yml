name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # requirements-ci.txt pins numpy==2.5.0 which requires Python >= 3.12
          # (3.11 made the dependency install itself fail — CI was dead on arrival)
          python-version: "3.12"

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Install private quant stack (required)
        # oprim / oskill are private wheels required by many production modules.
        # Set the PRIVATE_INDEX_URL repo secret to a private package index.
        # `secrets` is not an allowed context in a step-level `if:` — referencing it
        # there is a workflow *validation* error, so GitHub failed the run before
        # creating any job (0 jobs / 0s / no logs, every run since 6f773be added it).
        # Hoist the secret into `env` and branch on that instead.
        env:
          PRIVATE_INDEX_URL: ${{ secrets.PRIVATE_INDEX_URL }}
        if: ${{ env.PRIVATE_INDEX_URL != '' }}
        run: pip install --index-url "$PRIVATE_INDEX_URL" oprim oskill

      - name: Lint (ruff, non-blocking)
        run: ruff check . || true

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sel_v2 image
        # Smoke-build the primary image to catch Dockerfile/context regressions.
        run: docker build -f sel_v2/Dockerfile -t selene-sel-v2:ci .
