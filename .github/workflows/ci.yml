name: CI

on:
  push:
    branches: [main, "closure/**"]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.6
      - name: Ruff format fail-closed (full repo)
        run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.6
      - name: Ruff lint fail-closed (full repo)
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install mypy==1.15.0
      - run: mypy --ignore-missing-imports shared/runtime shared/security shared/ledger selene

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Install the quant stack (required)
        run: |
          pip install --no-deps \
            "oprim @ git+https://github.com/helios-plat/oprim@v3.10.33" \
            "oskill @ git+https://github.com/helios-plat/oskill@v4.3.0"
      - name: Run tests
        run: pytest -q -rs --cov=shared --cov=selene --cov-branch --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0 cyclonedx-bom==5.1.1
      - run: python -m selene.security.verify_redaction --root .
      - run: pip-audit -r requirements-ci.txt || true
      - run: cyclonedx-py environment -o evidence/security/sbom.json || python -c "import json,pathlib; pathlib.Path('evidence/security').mkdir(parents=True,exist_ok=True); pathlib.Path('evidence/security/sbom.json').write_text('{\"bomFormat\":\"CycloneDX\",\"status\":\"BLOCKED\"}')"

  artifact-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1
      - run: pytest -q tests/evidence tests/unit/test_release_identity.py tests/unit/test_side_effects.py tests/unit/test_provenance.py tests/unit/test_qualification_chain.py tests/unit/test_qualification_faults.py tests/unit/test_oos_gap_report.py tests/unit/test_shadow_gap_report.py tests/unit/test_readme_license.py

  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1
      - name: In-process PAPER chain and gap reports
        env:
          PYTHONPATH: .
          EXEC_MODE: PAPER
        run: |
          pytest -q tests/unit/test_qualification_chain.py tests/unit/test_qualification_faults.py tests/unit/test_oos_gap_report.py tests/unit/test_shadow_gap_report.py
          python scripts/report_oos.py
          python scripts/report_shadow.py
      - name: Isolated compose smoke (postgres+redis only; PARTIAL is not PASS)
        env:
          PYTHONPATH: .
          EXEC_MODE: PAPER
        run: |
          docker compose -f docker-compose.qualification.yml up -d
          python scripts/wait_qualification.py --timeout 90
          python scripts/qualification_smoke.py
          python scripts/qualification_faults.py
      - if: always()
        run: docker compose -f docker-compose.qualification.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Vendor the quant stack into the build context
        run: |
          pip install --target vendor --no-deps \
            "oprim @ git+https://github.com/helios-plat/oprim@v3.10.33" \
            "oskill @ git+https://github.com/helios-plat/oskill@v4.3.0"
      - name: Build sel_v2 image
        run: docker build -f sel_v2/Dockerfile -t selene-sel-v2:ci .

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("docker-compose.yml").read_text()
          assert "EXEC_MODE:            PAPER" in text or "EXEC_MODE: PAPER" in text.replace(" ","")
          print("release-policy EXEC_MODE=PAPER ok")
          PY
